[package]
name = "drive-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
aws-config = "1.12.0"
aws-sdk-s3 = "1.152.0"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
eframe = { version = "0.36.2", features = ["persistence"] }
egui_extras = "0.36.2"
futures = "0.3.34"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "time"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

